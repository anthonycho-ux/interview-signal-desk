<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARSAN TERMINAL — drilldown</title>
<style>
:root{--bg:#08090b;--line:#1a1e24;--fg:#c9d0d8;--dim:#5a6470;--amber:#e8b84a;--blue:#5f8fd8;--red:#e05a5a;--green:#4cc98a;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.5 system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:300px 1fr;height:100vh;overflow:hidden}

/* left rail: interview navigation */
.rail{border-right:1px solid var(--line);background:#0a0c0f;overflow-y:auto;padding:0}
.rail .rh{position:sticky;top:0;background:#0a0c0f;padding:12px 10px;border-bottom:1px solid var(--line);z-index:5}
.rail .rh h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0}
.rail .rh .cnt{font-family:var(--mono);font-size:10px;color:var(--amber);margin-top:2px}
.vid{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent;transition:background .15s}
.vid:hover{background:#0f1218}
.vid.sel{border-left-color:var(--amber);background:#101318}
.vid .d{font-family:var(--mono);font-size:10px;color:var(--dim)}
.vid .t{font-size:11px;margin:2px 0 4px;line-height:1.3}
.vid .mv{font-size:10px;color:var(--amber)}
.vid .mv.n{color:var(--dim)}
.vid .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--dim)}
.vid .meta .q{color:var(--fg)}

/* main field */
.field{overflow-y:auto;padding:14px}
.hdr{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line)}
.hdr h1{font-size:13px;font-weight:600;margin:0}
.hdr .vid-title{font-size:11px;color:var(--amber);margin-top:2px}
.hdr .ts{font-family:var(--mono);font-size:10px;color:var(--dim)}
.lang{font-size:11px}
.lang button{background:none;border:1px solid var(--line);color:var(--dim);padding:2px 8px;cursor:pointer;font-size:10px;border-radius:3px;margin-left:3px}
.lang button.on{color:var(--fg);border-color:var(--amber)}
body.ko .en{display:none} body.en .ko{display:none}

/* field map: horizontal price axis */
.map{position:relative;height:190px;margin:14px 0 10px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,#0a0c10,#0d1015 50%,#0a0c10)}
.map .ax{position:absolute;bottom:28px;left:4%;right:4%;height:1px;background:#2a3038}
.map .ax .tick{position:absolute;top:0;width:1px;height:5px;background:#3a4150}
.map .ax .tkl{position:absolute;top:8px;font-family:var(--mono);font-size:9px;color:var(--dim);transform:translateX(-50%);white-space:nowrap}
.map .lvl{position:absolute;width:0;height:0;z-index:2}
.map .lvl .line{position:absolute;top:0;width:1px;height:60px;background:currentColor}
.map .lvl .nm{position:absolute;font-family:var(--mono);font-size:9px;letter-spacing:.08em;white-space:nowrap;transform:translateX(-50%)}
.map .lvl .vl{position:absolute;font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap;transform:translateX(-50%)}
.map .lvl.wall{color:var(--red)}
.map .lvl.flip{color:var(--amber)}
.map .lvl.spot{color:var(--green)}
.map .lvl.band{color:#3a4150}
.map .spotdot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--green);z-index:3;box-shadow:0 0 8px var(--green);animation:pulse 3s infinite}
@keyframes pulse{50%{opacity:.4}}
.map .zone{position:absolute;top:0;bottom:60px;z-index:0;opacity:.07}
.map .zone.long{background:var(--green)}
.map .zone.short{background:var(--red)}

/* gamma meter */
.gm{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.gm .lbl{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.gm .bar{flex:1;height:10px;background:#0f1218;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.gm .bar .fill{position:absolute;left:50%;top:0;bottom:0}
.gm .bar .fill.neg{background:linear-gradient(90deg,transparent,var(--red));left:auto;right:0;width:60%}
.gm .bar .zero{position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--fg);z-index:2}
.gm .val{font-family:var(--mono);font-size:12px;font-weight:600}
.gm .val.neg{color:var(--red)}
.gm .regime{font-size:10px;color:var(--dim);font-family:var(--mono)}

/* theme ledger */
.ledger{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lh{display:grid;grid-template-columns:50px 1fr 60px 70px 80px;padding:5px 10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:#0f1218}
.lrow{display:grid;grid-template-columns:50px 1fr 60px 70px 80px;border-bottom:1px solid var(--line);padding:7px 10px;font-size:11px;cursor:pointer;transition:background .15s;align-items:center}
.lrow:hover{background:#101318}
.lrow:last-of-type{border-bottom:0}
.lrow .rk{font-family:var(--mono);font-size:10px;color:var(--dim)}
.lrow .nm{font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.lrow .nm .q{font-weight:400;font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:1px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm .q:hover{white-space:normal;overflow:visible;background:#1a1e25;padding:2px 4px;border-radius:2px;position:relative;z-index:5}
.lrow .sh{font-family:var(--mono);font-size:10px;text-align:right}
.lrow .in{font-size:9px;text-align:right;font-family:var(--mono)}
.lrow .in.live{color:var(--green)}
.lrow .in.gap{color:var(--red)}
.lrow .kv{font-family:var(--mono);font-size:10px;text-align:right}
.lrow.gap{opacity:.55}
.det{display:none;padding:8px 10px;background:#0f1218;border-bottom:1px solid var(--line);font-size:10px}
.det.show{display:block}
.det .qi{padding:3px 0;border-bottom:1px dashed #1e232a;font-family:var(--mono);color:var(--dim);line-height:1.5}
.det .qi em{color:var(--fg);font-style:normal}
.det .src{font-size:9px;color:var(--dim);display:block;margin-top:2px}

.foot{padding:8px 0;font-size:10px;color:var(--dim);font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap}
.foot b{color:var(--fg)}
</style>
</head>
<body class="en">
<div class="wrap">
<div class="rail">
 <div class="rh"><h2><span class="en">cem karsan</span><span class="ko">셈 카산</span></h2><div class="cnt" id="nv">—</div></div>
 <div id="vids"></div>
</div>
<div class="field">
 <div class="hdr">
  <div><h1><span class="en">signal desk</span><span class="ko">시그널 데스크</span></h1><div class="vid-title" id="vt"></div></div>
  <div style="display:flex;align-items:center;gap:8px">
   <span class="ts" id="ts">—</span>
   <div class="lang"><button onclick="setL('en')" class="on" id="btnEn">EN</button><button onclick="setL('ko')" id="btnKo">한</button></div>
  </div>
 </div>
 <div class="map" id="map"></div>
 <div class="gm" id="gm"></div>
 <div class="lh"><span>rank</span><span>theme · quote</span><span>share</span><span>key</span><span>instrument</span></div>
 <div class="ledger" id="ledger"></div>
 <div class="foot"><span><span class="en">click row to expand quotes</span><span class="ko">행 클릭으로 인용 확장</span></span><span><span class="en">gap=no instrument</span><span class="ko">공백=계측기 없음</span></span><span><span class="en">live=data feed</span><span class="ko">라이브=데이터 피드</span></span></div>
</div></div>

<script>
// ── data ──
const VIDS=[
 {id:"v01",d:"10/28",t:"Why Cem Karsan Says There's No December Hike Coming",mv:"crash ▼18 vs base",
  quotes:{crash:8,walls:6,fed:3,vol:2,opex:2,regime:1,gamma:0},
  themes:[.8,.9,.5,.4,.6,.7,.95]},
 {id:"v02",d:"10/23",t:"tastylive weekly",mv:"steady",
  quotes:{crash:3,walls:4,fed:2,vol:3,opex:1,regime:2,gamma:0},
  themes:[.6,.5,.4,.5,.3,.4,.55]},
 {id:"v03",d:"10/21",t:"four month window before a decline",mv:"regime +11 vs base",
  quotes:{crash:5,walls:5,fed:4,vol:2,opex:3,regime:4,gamma:0},
  themes:[.7,.8,.5,.4,.3,.5,.6]},
 {id:"v04",d:"10/16",t:"vol suppression talk",mv:"vol +23 vs base",
  quotes:{crash:2,walls:2,fed:1,vol:6,opex:1,regime:1,gamma:0},
  themes:[.5,.4,.3,.8,.5,.4,.3]},
 {id:"v05",d:"10/14",t:"short clip",mv:"too thin",
  quotes:{crash:1,walls:1,fed:0,vol:1,opex:0,regime:0,gamma:0},
  themes:[.3,.3,.2,.4,.3,.3,.2]},
 {id:"v06",d:"10/13",t:"dealer positioning deep-dive",mv:"crash 68% outlier",
  quotes:{crash:10,walls:2,fed:2,vol:1,opex:1,regime:1,gamma:0},
  themes:[.9,.3,.2,.2,.1,.3,.98]},
];
const LEVELS=[
 {p:7400,t:"wall",n:"PUT WALL",v:"7,400"},
 {p:7500,t:"band",n:"lower band",v:"7,500"},
 {p:7558,t:"spot",n:"SPOT",v:"7,558"},
 {p:7650,t:"wall",n:"PUT WALL",v:"7,650"},
 {p:7713,t:"flip",n:"FLIP",v:"7,713"},
 {p:7800,t:"band",n:"call wall",v:"7,800"},
];
const THEMES=[
 {id:"crash",nm:"crash",ko:"크래시",k:"VIX",inst:"nk-risk",live:1},
 {id:"walls",nm:"walls",ko:"벽",k:"flip",inst:"gamma+stack",live:1},
 {id:"fed",nm:"fed",ko:"연준",k:"—",inst:"—",live:0},
 {id:"vol",nm:"vol",ko:"변동성",k:"ATM",inst:"fixed-vol",live:1},
 {id:"opex",nm:"opex",ko:"옵션만기",k:"—",inst:"—",live:0},
 {id:"regime",nm:"regime",ko:"레짐",k:"ES",inst:"pre-mkt",live:1},
 {id:"gamma",nm:"gamma",ko:"감마",k:"flip",inst:"page",live:1},
];
const QUOTES={
 crash:"\"they want a good outcome by 2028 and they want to be a...\"",
 walls:"\"it's been that way for a long time. And the reason...\"",
 fed:"\"no bids to the bond market. And as much as Bissant tries...\"",
 vol:"\"there is a real suppression of equity volatility...\"",
 opex:"\"two Mondays ago when there was no news, the...\"",
 regime:"\"why is this long Vomma? Why do dealers get long vo...\"",
 gamma:"\"the field itself. He has not talked about it directly.\"",
};
const MIN=7300,MAX=7900;
let sel=0,exp=null;

function x(v){return 4+((v-MIN)/(MAX-MIN)*92);}
function vids(){
 document.getElementById('nv').textContent=VIDS.length+" interviews";
 document.getElementById('vids').innerHTML=VIDS.map((v,i)=>{
  const total=Object.values(v.quotes).reduce((a,b)=>a+b,0);
  return `<div class="vid${i===sel?' sel':''}" onclick="sel=${i};vids();field()">
  <div class="d">${v.d}</div><div class="t">${v.t}</div>
  <div class="mv${v.hot?'':' n'}">${v.mv}</div>
  <div class="meta"><span class="q">${total} quotes</span><span>${v.id}</span></div>
 </div>`}).join('');
}
function map(){
 const m=document.getElementById('map');
 m.innerHTML=`
 <div class="zone long" style="left:0;width:${x(7558)-4}%"></div>
 <div class="zone short" style="left:${x(7558)}%;width:${96-x(7558)+4}%"></div>
 ${LEVELS.map(l=>{
  const xp=x(l.p);
  const up=l.p>=7650; // labels above for upper levels, below for lower
  return `<div class="lvl ${l.t}" style="left:${xp}%;bottom:28px">
   <div class="line"></div>
   <div class="nm" style="${up?'bottom:64px':'top:36px'}">${l.n}</div>
   <div class="vl" style="${up?'bottom:52px':'top:24px'}">${l.v}</div>
  </div>`;
 }).join('')}
 <div class="ax">${LEVELS.map(l=>{
  const xp=x(l.p);return `<div class="tick" style="left:${xp}%"></div><div class="tkl" style="left:${xp}%">${l.p}</div>`;
 }).join('')}</div>
 <div class="spotdot" style="left:${x(7558)}%;bottom:28px;transform:translate(-50%,50%)"></div>`;
}
function gm(){
 const g=-88.3;
 document.getElementById('gm').innerHTML=`
 <span class="lbl"><span class="en">net gamma</span><span class="ko">순 감마</span></span>
 <div class="bar"><div class="fill${g<0?' neg':''}" style="width:${Math.min(Math.abs(g)/2,60)}%"></div><div class="zero"></div></div>
 <span class="val ${g<0?'neg':''}">${g}B</span>
 <span class="regime">${g<0?'SHORT GAMMA':'LONG GAMMA'}</span>`;
}
function ledger(){
 const v=VIDS[sel];
 const total=Object.values(v.quotes).reduce((a,b)=>a+b,0);
 document.getElementById('vt').textContent=v.d+" — "+v.t;
 document.getElementById('ledger').innerHTML=THEMES.map((t,i)=>{
  const cnt=v.quotes[t.id]||0;
  const share=total?cnt/total:0;
  const isExp=exp===t.id;
  return `<div class="lrow${t.live?'':' gap'}" onclick="exp=isExp?null:'${t.id}';ledger()">
  <span class="rk">${String(i+1).padStart(2,'0')}</span>
  <span class="nm">${t.nm} <span class="ko" style="font-weight:400;font-size:9px;opacity:.6">${t.ko}</span><span class="q" title="${QUOTES[t.id].replace(/"/g,'&quot;')}">${QUOTES[t.id].slice(0,70)}…</span></span>
  <span class="sh">${(share*100).toFixed(0)}%</span>
  <span class="kv">${t.k} ${cnt}</span>
  <span class="in${t.live?' live':' gap'}"><span class="en">${t.live?t.inst:'— gap'}</span><span class="ko">${t.live?t.inst:'— 공백'}</span></span>
 </div>
 ${isExp?`<div class="det show"><div class="qi"><em>${QUOTES[t.id]}</em><span class="src">${t.inst} · ${t.live?'live':'not built'} · ${cnt} quotes</span></div></div>`:''}`;
 }).join('');
}
function field(){map();gm();ledger();}
function setL(l){document.body.className=l;document.getElementById('btnEn').className=l==='en'?'on':'';document.getElementById('btnKo').className=l==='ko'?'on':'';}
vids();field();
</script>
</body></html>
